<!DOCTYPE html>
<html lang="ko" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>번아웃이신가요? 저도요</title>
<style>
:root{
  --bg:#E8EAE6;
  --ink:#1E2321;
  --muted:#6B716C;
  --line:#C9CEC6;
  --mark:#F2D14E;
  --leaf:#5C7A5E;
  --paper:#F4F5F1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171A18;--ink:#E4E7E2;--muted:#949A93;--line:#2E332F;--mark:#C9A93F;--leaf:#7FA37F;--paper:#1E221F;
  }
}
:root[data-theme="dark"]{
  --bg:#171A18;--ink:#E4E7E2;--muted:#949A93;--line:#2E332F;--mark:#C9A93F;--leaf:#7FA37F;--paper:#1E221F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:17px;line-height:1.75;letter-spacing:-0.01em;word-break:keep-all;
}
main{max-width:34rem;margin:0 auto;padding:0 1.3rem 5rem}
section{padding:3.4rem 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0}
h1{font-size:clamp(2.1rem,9vw,3.1rem);line-height:1.25;font-weight:800;margin:0;letter-spacing:-0.035em}
h2{font-size:1.25rem;font-weight:700;margin:0 0 .5rem;letter-spacing:-0.02em}
p{margin:0 0 1rem}
.dim{color:var(--muted)}
.small{font-size:.92rem}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 94%,transparent 94%);padding:0 .1em}
button{
  font:inherit;color:var(--ink);background:none;border:1px solid var(--ink);
  border-radius:2px;padding:.55rem 1.05rem;cursor:pointer;transition:background .15s ease,color .15s ease;
}
button:hover{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* gate screens */
#gate{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.3rem;text-align:center;
}
.gate-step{display:none;max-width:26rem}
.gate-step.active{display:block}
.gate-title{font-size:clamp(1.6rem,7vw,2.1rem);font-weight:800;letter-spacing:-0.03em;line-height:1.4;margin-bottom:1.8rem}
.gate-row{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}
.gate-row button{padding:.85rem 1.5rem;font-size:1.02rem}
.gate-sub{color:var(--muted);font-size:.92rem;margin-top:1.4rem}

/* main content hidden until gate passed */
#app{display:none}

/* top control bar */
.ctrlbar{
  max-width:34rem;margin:0 auto;padding:1rem 1.3rem 0;
  display:flex;justify-content:flex-end;gap:.5rem;
}
.ctrlbar button{
  padding:.3rem .65rem;font-size:.8rem;border-color:var(--line);color:var(--muted);
}
.ctrlbar button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* hero */
.hero{padding-top:2.4rem}
.hero .reply{font-size:clamp(2.1rem,9vw,3.1rem);font-weight:800;letter-spacing:-0.035em;line-height:1.25;color:var(--muted)}
.hero p{margin-top:1.6rem;max-width:26rem}

/* breathing */
.breath-stage{height:190px;display:flex;align-items:center;justify-content:center;position:relative;margin:1.4rem 0 .4rem}
.blob{width:78px;height:78px;border-radius:50%;background:var(--leaf);opacity:.22;transform:scale(1)}
.blob.go{animation:breathe 11s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(1);opacity:.2}36%{transform:scale(2.15);opacity:.42}50%{transform:scale(2.15);opacity:.42}100%{transform:scale(1);opacity:.2}}
.breath-word{position:absolute;font-size:1rem;color:var(--muted);text-align:center;padding:0 1rem}
@media (prefers-reduced-motion:reduce){.blob.go{animation:none}}

/* prescription */
.slip{background:var(--paper);border:1px solid var(--line);padding:1.5rem 1.4rem 1.6rem;position:relative;margin-bottom:1.1rem}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:repeating-linear-gradient(to right,var(--line) 0 6px,transparent 6px 12px)}
.slip .label{font-size:.82rem;color:var(--muted);margin-bottom:.5rem}
.slip .dose{font-size:1.32rem;font-weight:700;line-height:1.5;letter-spacing:-0.02em}
.slip .time{margin-top:.7rem;font-size:.88rem;color:var(--muted)}

/* crumple */
.note{width:100%;min-height:110px;resize:vertical;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:.9rem 1rem;font:inherit;font-size:1rem;line-height:1.7}
.note:focus{outline:2px solid var(--leaf);outline-offset:1px}
.crumpling{animation:crumple .9s cubic-bezier(.4,0,.6,1) forwards;transform-origin:50% 60%}
@keyframes crumple{0%{transform:scale(1) rotate(0);filter:blur(0);opacity:1}45%{transform:scale(.42) rotate(-16deg);filter:blur(1px);opacity:.9}100%{transform:scale(.06) rotate(38deg) translate(120px,180px);opacity:0}}
.thrown{margin-top:.9rem;color:var(--muted);font-size:.95rem;min-height:1.6rem}

/* checklist */
ul.bar{list-style:none;padding:0;margin:.8rem 0 1.2rem}
ul.bar li{margin:0 0 .15rem}
ul.bar label{display:flex;gap:.7rem;align-items:flex-start;padding:.45rem .2rem;cursor:pointer}
ul.bar input{appearance:none;width:1.1rem;height:1.1rem;flex:0 0 auto;margin-top:.35rem;border:1px solid var(--ink);border-radius:2px;background:none;cursor:pointer}
ul.bar input:checked{background:var(--mark);border-color:var(--mark)}
ul.bar input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
ul.bar input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tally{font-size:.95rem;color:var(--muted);min-height:1.6rem}

footer{padding:3.4rem 0 0;border-top:1px solid var(--line);color:var(--muted)}
footer .last{color:var(--ink);font-size:1.15rem;font-weight:700;line-height:1.7;letter-spacing:-0.02em}
</style>
</head>

      <button data-lang="en">English</button>
    </div>
  </div>

      <button id="locOut"></button>
      <button id="locIn"></button>
    </div>
    <div class="gate-sub" id="locSub"></div>
  </div>
</div>

<div class="ctrlbar" id="app">
  <button id="resetBtn"></button>
</div>

<main id="app2" style="display:none">

  <section class="hero">

  <section>

  <section>

    </div>

  <section>
    <h2 id="t-barH"></h2>

      <li><label><input type="checkbox" data-k="9"><span data-t="c9"></span></label></li>
    </ul>
    <div class="tally" id="tally"></div>
  </section>

  <footer>
    <p class="last" id="t-foot1"></p>
    <p class="small" id="t-foot2"></p>
    <p class="small" id="t-foot3"></p>
  </footer>

</main>

var lang='ko', loc='in', pool=[];

function t(k){return I18N[lang][k];}

function renderStatic(){
  document.getElementById('htmlRoot').lang = lang;
  document.getElementById('locTitle').textContent = t('locTitle');
  document.getElementById('locOut').textContent = t('locOut');
  document.getElementById('locIn').textContent = t('locIn');
  document.getElementById('locSub').textContent = t('locSub');
  document.getElementById('resetBtn').textContent = t('reset');
  document.getElementById('t-h1').textContent = t('h1');
  document.getElementById('t-reply').textContent = t('reply');
  document.getElementById('t-intro').textContent = t('intro');
  document.getElementById('t-introsub').textContent = loc==='out' ? t('introsub_out') : t('introsub_in');
  document.getElementById('t-breathH').textContent = t('breathH');
  document.getElementById('t-breathSub').textContent = t('breathSub');
  document.getElementById('breathBtn').textContent = t('breathStart');
  document.getElementById('breathWord').textContent = t('breathReady');
  document.getElementById('breathCount').textContent = '';
  document.getElementById('t-doseH').textContent = t('doseH');
  document.getElementById('t-doseSub').textContent = loc==='out' ? t('doseSub_out') : t('doseSub_in');
  document.getElementById('t-doseLabel').textContent = t('doseLabel');
  document.getElementById('dose').textContent = t('dosePlaceholder');
  document.getElementById('doseTime').textContent = t('doseTimePrefix') + t('doseTimePlaceholder');
  document.getElementById('doseBtn').textContent = t('doseBtn');
  document.getElementById('doseAgain').textContent = t('doseAgain');
  document.getElementById('doseAgain').disabled = true;
  document.getElementById('t-crumpleH').textContent = t('crumpleH');
  document.getElementById('t-crumpleSub').textContent = t('crumpleSub');
  document.getElementById('note').placeholder = t('notePlaceholder');
  document.getElementById('note').value='';
  document.getElementById('crumpleBtn').textContent = t('crumpleBtn');
  document.getElementById('thrown').textContent = '';
  document.getElementById('t-barH').textContent = t('barH');
  document.getElementById('t-barSub').textContent = t('barSub');
  ['c0','c1','c2','c3','c4','c5','c6','c7','c8','c9'].forEach(function(k){
    document.querySelector('[data-t="'+k+'"]').textContent = t(k);
  });
  document.getElementById('tally').textContent = t('tallyStart');
  document.getElementById('t-foot1').innerHTML = t('foot1');
  document.getElementById('t-foot2').innerHTML = t('foot2Pre') + '<span class="mark">' + t('foot2Mark') + '</span>' + t('foot2Post');
  document.getElementById('t-foot3').textContent = t('foot3');
  pool = [];
  resetBreath();
}

/* gate */
document.querySelectorAll('[data-lang]').forEach(function(btn){
  btn.addEventListener('click',function(){
    lang = btn.getAttribute('data-lang');
    document.getElementById('step-lang').classList.remove('active');
    document.getElementById('step-loc').classList.add('active');
    document.getElementById('locTitle').textContent = t('locTitle');
    document.getElementById('locOut').textContent = t('locOut');
    document.getElementById('locIn').textContent = t('locIn');
    document.getElementById('locSub').textContent = t('locSub');
  });
});
function enterApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('app2').style.display='block';
  renderStatic();
}
document.getElementById('locOut').addEventListener('click',function(){loc='out';enterApp();});
document.getElementById('locIn').addEventListener('click',function(){loc='in';enterApp();});
document.getElementById('resetBtn').addEventListener('click',function(){
  document.getElementById('app').style.display='none';
  document.getElementById('app2').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('step-loc').classList.remove('active');
  document.getElementById('step-lang').classList.add('active');
});

/* breathing */
var blob,word,bBtn,bCount,running=false,cycle=0,timers=[];
function clearT(){timers.forEach(clearTimeout);timers=[];}
function runCycle(){
  if(cycle>=3){stopBreath(true);return;}
  word.textContent=t('breathIn');
  timers.push(setTimeout(function(){word.textContent=t('breathHold');},4000));
  timers.push(setTimeout(function(){word.textContent=t('breathOut');},5500));
  timers.push(setTimeout(function(){cycle++;bCount.textContent=cycle+' / 3';runCycle();},11000));
}
function stopBreath(done){
  running=false;clearT();blob.classList.remove('go');
  bBtn.textContent = done ? t('breathAgain') : t('breathRestart');
  word.textContent = done ? t('breathDone') : t('breathReady');
  cycle=0;
}
function resetBreath(){
  blob=document.getElementById('blob');word=document.getElementById('breathWord');
  bBtn=document.getElementById('breathBtn');bCount=document.getElementById('breathCount');
  running=false;cycle=0;clearT();blob.classList.remove('go');
}
document.getElementById('breathBtn').addEventListener('click',function(){
  if(running){stopBreath(false);return;}
  running=true;cycle=0;bCount.textContent='0 / 3';
  blob.classList.add('go');bBtn.textContent=t('breathStop');runCycle();
});

/* prescription */
var dose=document.getElementById('dose'),dTime=document.getElementById('doseTime'),
    dBtn=document.getElementById('doseBtn'),dAgain=document.getElementById('doseAgain');
function pick(){
  var filtered = ITEMS.filter(function(it){return it[4]===loc;});
  if(!pool.length){pool=filtered.slice();}
  var i=Math.floor(Math.random()*pool.length),d=pool.splice(i,1)[0];
  dose.textContent = lang==='ko' ? d[0] : d[1];
  dTime.textContent = t('doseTimePrefix') + (lang==='ko' ? d[2] : d[3]);
  dBtn.textContent=t('doseAgain2');dAgain.disabled=false;dAgain.textContent=t('doseAgain');
}
dBtn.addEventListener('click',pick);
dAgain.addEventListener('click',pick);

/* crumple */
var note=document.getElementById('note'),cBtn=document.getElementById('crumpleBtn'),
    thrown=document.getElementById('thrown'),tn=0;
cBtn.addEventListener('click',function(){
  if(!note.value.trim()){thrown.textContent=t('crumpleEmpty');return;}
  note.classList.add('crumpling');cBtn.disabled=true;
  setTimeout(function(){
    note.value='';note.classList.remove('crumpling');cBtn.disabled=false;
    var lines=t('thrown');
    thrown.textContent=lines[tn++%lines.length];
  },900);
});

/* checklist */
var bar=document.getElementById('bar'),tally=document.getElementById('tally');
var boxes=bar.querySelectorAll('input');
function save(){
  try{
    var v=[];boxes.forEach(function(b){v.push(b.checked?1:0)});
    localStorage.setItem('burnout-bar',JSON.stringify({d:new Date().toDateString(),v:v}));
  }catch(e){}
}
function updateTally(){
  var c=0;boxes.forEach(function(b){if(b.checked)c++});
  tally.textContent = c===0 ? t('tallyStart') : t('tally')[c];
}
boxes.forEach(function(b){b.addEventListener('change',function(){updateTally();save();})});
function loadSaved(){
  try{
    var raw=localStorage.getItem('burnout-bar');
    if(raw){
      var s=JSON.parse(raw);
      if(s&&s.d===new Date().toDateString()&&s.v){
        boxes.forEach(function(b,i){b.checked=!!s.v[i]});
        updateTally();
      }
    }
  }catch(e){}
}
document.getElementById('locOut').addEventListener('click',loadSaved);
document.getElementById('locIn').addEventListener('click',loadSaved);
})();
